services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: fastquiz
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
    # Yalnızca bu makineden erişilsin (zayıf geliştirme parolası ağa açılmasın)
    ports: ["127.0.0.1:5432:5432", "[::1]:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql   # PostgreSQL 18 imajının veri dizini
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d fastquiz"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        REQUIREMENTS: dev
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://quiz:quiz@db:5432/fastquiz
    # Açılışta migrasyonları uygular, veritabanı boşsa soru havuzunu yükler
    command: >
      sh -c "python manage.py migrate --noinput
      && python manage.py seed_questions
      && python manage.py purge_stale_sessions
      && python manage.py runserver 0.0.0.0:8000"
    ports: ["127.0.0.1:8000:8000", "[::1]:8000:8000"]
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
