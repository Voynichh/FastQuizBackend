version: 2
updates:
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Yalnızca güvenlik ve küçük sürüm güncellemeleri; büyük sürümler elle incelenir.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
