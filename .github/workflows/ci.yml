name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fastquiz
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quiz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quiz -d fastquiz"
          --health-interval 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only
      DATABASE_URL: postgres://quiz:quiz@localhost:5432/fastquiz
      DJANGO_SETTINGS_MODULE: config.settings.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
      - run: pip-audit -r requirements/prod.txt

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t fast-quiz-api .
